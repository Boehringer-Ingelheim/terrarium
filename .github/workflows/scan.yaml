# ── Permissions policy ──────────────────────────────────────────────────────
# Default: contents:read (workflow level).
# security-events:write — scan job only (SARIF upload).
# packages:read — scan job only (GHCR pull).
# ── Secret isolation policy ─────────────────────────────────────────────────
# No secrets in global env: blocks.
# GITHUB_TOKEN scoped to docker/login-action steps only.
name: Scan terrarium image (Trivy)

on:
  push:
    branches: [master]
    paths:
      - "docker/**"
      - ".github/workflows/scan.yaml"
  pull_request:
    branches: [master]
    paths:
      - "docker/**"
      - ".github/workflows/scan.yaml"
  # Also run after the build workflow completes (image may now be in GHCR)
  workflow_run:
    workflows: ["Build, test & publish terrarium"]
    types: [completed]
    branches: [master]
  # Released images are scanned by release.yaml, which calls this workflow after
  # its manifest job with the exact published tag (INFIAAS-11804). The former
  # `release: published` trigger never fired for dispatch cuts (no GitHub
  # Release), and raced the ~30 min build for UI releases.
  workflow_call:
    inputs:
      image-tag:
        description: "v-less released image tag to scan, e.g. 4.9.0-pre (scans <tag>-linux-<arch>)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      debug_context:
        description: "Dump GitHub contexts for debugging"
        type: boolean
        default: false
  # schedule:
  #   - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  scan:
    name: Scan (${{ matrix.platform }})
    # Skip if the triggering workflow failed (images weren't pushed)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dump-context
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_context == 'true'

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR and push events don't publish an image for this workflow to scan.
      # Force those events down the filesystem-scan path so they don't
      # accidentally scan a stale shared `latest-*` image from GHCR.
      # (When called by release.yaml, github.event_name is the CALLER's event —
      # release / workflow_dispatch — so a release scan always takes this path.)
      - name: Try to pull published image
        id: pull
        if: >-
          github.event_name != 'pull_request' &&
          github.event_name != 'push'
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ inputs.image-tag }}
        run: |
          # Release scan (workflow_call): the exact published per-arch tag.
          # Otherwise (workflow_run after master, manual dispatch): latest-<arch>.
          if [ -n "${RELEASE_TAG}" ]; then
            [[ "${RELEASE_TAG}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] \
              || { echo "::error::invalid image-tag input: '${RELEASE_TAG}'"; exit 1; }
            TAG="${RELEASE_TAG}-${{ matrix.suffix }}"
          else
            TAG="latest-${{ matrix.suffix }}"
          fi
          # lowercase: OCI repo names must be lowercase (owner may have uppercase).
          # Emit the ref as an output (set before the pull so it exists even on failure)
          # for the image-ref below, which is a with: block and can't use bash ${,,}.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          docker pull "${IMAGE}"

      # A release scan must scan the released image. Never fall back to the
      # filesystem scan and report green for an image that was not scanned
      # (the INFIAAS-11426 Trivy post-mortem failure class).
      - name: Fail if the released image could not be pulled
        if: inputs.image-tag != '' && steps.pull.outcome != 'success'
        env:
          IMAGE: ${{ steps.pull.outputs.image }}
        run: |
          echo "::error::release scan: could not pull ${IMAGE}"
          exit 1

      # Full image scan — only when a published image is available
      - name: Trivy image scan
        if: steps.pull.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The pinned action defaults to Trivy v0.70.0; pin the scanner
          # explicitly so the version is visible and reviewable here rather
          # than moving whenever the action's default changes.
          version: v0.74.0
          image-ref: ${{ steps.pull.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          # Accepted vendor-only residuals (INFIAAS-9587): one entry per CVE at
          # its exact path, each with a reason and an expiry. Generated by
          # scripts/trivy-residuals.sh; anything not listed still fails here.
          trivyignores: .trivyignore.yaml
          # Without this, trivy-action unsets TRIVY_SEVERITY whenever
          # format is sarif ("Building SARIF report with all severities"),
          # so the severity gate above is ignored and a LOW/UNKNOWN finding
          # fails the build via exit-code: 1.
          limit-severities-for-sarif: true

      # Filesystem scan of Dockerfile + config — for PR/push validation and
      # whenever no published image is available.
      # (avoids building the full image which times out the runner)
      - name: Trivy filesystem scan (no published image)
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'push' ||
          steps.pull.outcome != 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # See note above: keep both scan paths on the same Trivy version.
          version: v0.74.0
          scan-type: fs
          scan-ref: docker/
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          scanners: misconfig,secret
          # See note above: required for `severity` to actually gate the build.
          limit-severities-for-sarif: true

      # Human-readable findings in the job log (Trivy post-mortem follow-up):
      # SARIF only surfaces in the Security tab. Never gates (exit-code 0); the
      # SARIF scan above is the gate. Runs even when that gate failed.
      - name: Trivy image findings (table, informational)
        if: always() && steps.pull.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.pull.outputs.image }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          # Same accepted residuals as the gate, so the log shows what gates.
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # hashFiles: no SARIF when a release pull failed (no scan ran) — the
        # explicit failure step above is the signal, not a missing-file error.
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          # Release scans get their own category so they don't replace the
          # master/latest results in the Security tab.
          category: trivy-${{ inputs.image-tag != '' && 'release-' || '' }}${{ matrix.suffix }}
