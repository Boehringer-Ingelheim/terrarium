---
# Lint & mechanical guardrails.
# Runs the same targets as `make lint` so local and CI enforcement never drift:
#   - guardrails : do-not-regress security counts + ratchet metrics, then pin
#                  freshness (GO/ROCKYLINUX/UBI9 pins current; network, blocking;
#                  dated exceptions in scripts/pin-freshness-allowlist.txt)
#   - shellcheck : severity=warning over shell sources (blocking)
#   - hadolint   : Dockerfile lint, error threshold (blocking since INFIAAS-11916
#                  replaced the last two config heredocs with static files)
name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Guardrails, shellcheck, hadolint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mechanical guardrails + pin freshness
        run: make guardrails

      - name: Shellcheck (severity=warning)
        run: make shellcheck

      # Fail if the vendor-key pins in vendor-keys.env drift from the Dockerfile
      # ENV block (fingerprints only; no key material).
      - name: Vendor-key drift
        run: make check-keys-drift

      # Hermetic helper unit suite in the 'helpers' stage. Runs before the main
      # build (main.yaml) so a broken helper fails fast and cheap.
      - name: Helper unit suite ('helpers' stage)
        run: make docker-test-helpers

      # CI-script unit suite (scripts/tests: publish-sbom.sh, guardrails). Runs
      # on the host because the 'helpers' stage builds from ./docker and cannot
      # see scripts/. bats-core is cloned at the Dockerfile's pinned version,
      # exactly as the 'helpers' stage does; jq is preinstalled on the runner.
      - name: CI-script unit suite
        run: |
          BATS_CORE_VERSION=$(scripts/dockerfile-arg.sh BATS_CORE_VERSION)
          git clone --depth 1 --branch "v${BATS_CORE_VERSION}" \
            https://github.com/bats-core/bats-core "$RUNNER_TEMP/bats"
          "$RUNNER_TEMP/bats/install.sh" "$HOME/.local"
          PATH="$HOME/.local/bin:$PATH" make test-scripts

      # Blocking (INFIAAS-11916): hadolint cannot parse heredocs, and the last
      # two (google-cloud repo, tenv profile) are now static files under
      # docker/files/ (HEREDOC_MAX=0 in check-guardrails.sh keeps it that way).
      # The image is pinned by digest in the Makefile (HADOLINT_IMAGE).
      - name: Hadolint
        run: make hadolint
