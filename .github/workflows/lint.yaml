---
# Lint & mechanical guardrails.
# Runs the same targets as `make lint` so local and CI enforcement never drift:
#   - guardrails : do-not-regress security counts + ratchet metrics (blocking)
#   - shellcheck : severity=warning over shell sources (blocking)
#   - hadolint   : Dockerfile lint (INFORMATIONAL until INFIAAS-11426 heredoc
#                  extraction lets hadolint parse the file; then made blocking)
name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Guardrails, shellcheck, hadolint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mechanical guardrails
        run: make guardrails

      - name: Shellcheck (severity=warning)
        run: make shellcheck

      # Informational until the shell-heredocs are extracted (Phase 4/5) — until
      # then hadolint 2.14 cannot parse Dockerfile.terrarium. Flip to blocking by
      # removing continue-on-error once `make hadolint` exits 0 on this branch.
      - name: Hadolint (informational)
        continue-on-error: true
        run: make hadolint
