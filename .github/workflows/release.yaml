---
# ── Permissions policy ──────────────────────────────────────────────────────
# Default: contents:read (workflow level).
# contents:write — tag job (auto-create the tag if missing) and release-assets
#                  job (attach SBOMs to a GitHub Release) only. The build jobs
#                  never hold it (INFIAAS-11804), because they run third-party
#                  build tooling that receives the token (see below).
# packages:write — release/manifest jobs only (GHCR push).
# id-token:write — release job only: keyless cosign signature of the SBOM
#                  (INFIAAS-11804).
# actions:read   — release-assets job only (download the sbom-<arch> artifacts).
# packages:read + security-events:write — scan job only (calls scan.yaml to
#                  Trivy-scan the published image and upload SARIF).
# ── Secret isolation policy ─────────────────────────────────────────────────
# No secrets in global env: blocks.
# GITHUB_TOKEN is used by: docker/login-action; the build steps, as the BuildKit
# secret `tenv_github_token` (only `tenv tofu install` reads it, to avoid the
# anonymous api.github.com rate limit; the release job's token is contents:read
# + packages:write + id-token:write); and GH_TOKEN in the tag and
# release-assets jobs (git push of the tag; gh run download / release upload).
name: Release terrarium (manual)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag with leading v (e.g. v4.7.0). The git tag keeps the v; the published image is normalized v-less (e.g. 4.7.0)."
        required: true
      debug_context:
        description: "Dump GitHub contexts for debugging"
        type: boolean
        default: false

permissions:
  contents: read

################################################################################
# 1 ────────── Build, test & push (matrix: amd64 + arm64) ───────────────────
################################################################################
jobs:
  tag:
    name: Resolve & ensure tag
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    outputs:
      tag: ${{ steps.ensure.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure tag exists (create on HEAD if missing)
        id: ensure
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Resolve tag from release event or workflow_dispatch input
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${EVENT_TAG}"
          else
            TAG="${INPUT_TAG}"
          fi

          # Tagging standard: git tags are ALWAYS v-prefixed (vX.Y.Z), image tags
          # are published v-less (X.Y.Z — see the push & manifest steps). Normalize
          # here so the git tag is canonical no matter how the operator typed it.
          TAG="v${TAG#v}"

          # Validate tag for both Git and Docker usage
          if [ "$TAG" = "v" ]; then
            echo "::error::Tag input must not be empty"; exit 1
          fi
          if [ "${#TAG}" -gt 128 ]; then
            echo "::error::Tag '${TAG}' is too long (max 128 characters)"; exit 1
          fi
          case "$TAG" in
            -*) echo "::error::Tag '${TAG}' must not start with '-'"; exit 1 ;;
            *[!0-9A-Za-z_.-]*) echo "::error::Tag '${TAG}' contains invalid characters. Allowed: A-Z, a-z, 0-9, '_', '-', '.'"; exit 1 ;;
          esac

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag '${TAG}' already exists at $(git rev-parse "refs/tags/${TAG}")"
          else
            echo "Tag '${TAG}' does not exist — creating on HEAD ($(git rev-parse HEAD))"
            git tag -- "${TAG}"
            # Race-safe: if a concurrent run pushed first, accept the existing tag
            if git push origin "refs/tags/${TAG}"; then
              echo "Tag '${TAG}' pushed to origin"
            elif git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::warning::Tag '${TAG}' already exists on origin (concurrent run) — using it"
            else
              echo "::error::Failed to push tag '${TAG}' to origin and tag does not exist on origin"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  release:
    name: Build & release (${{ matrix.platform }})
    needs: [tag]
    runs-on: ${{ matrix.runner }}
    # No contents:write here (INFIAAS-11804): this job's GITHUB_TOKEN reaches
    # third-party build tooling (tenv) as a BuildKit secret.
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: -linux-amd64
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: -linux-arm64
            arch: arm64

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}

      - uses: ./.github/actions/dump-context
        if: github.event.inputs.debug_context == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # INFIAAS-11804: pin BuildKit (see main.yaml for the full rationale;
          # enforced by scripts/check-guardrails.sh "buildkit pinned").
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gate: build through the test stage — bats must pass
      - name: Build & run tests
        env:
          TENV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read Dockerfile ARG defaults and pass as --build-arg so buildkit's
          # cache-from honours version bumps as a cache-key change (without
          # this, stale cached layers for the tenv/terraform/opentofu install
          # step can satisfy cache-from hits and mask version updates).
          TENV_VERSION=$(scripts/dockerfile-arg.sh TENV_VERSION)
          TERRAFORM_VERSION=$(scripts/dockerfile-arg.sh TERRAFORM_VERSION)
          OPENTOFU_VERSION=$(scripts/dockerfile-arg.sh OPENTOFU_VERSION)
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            docker buildx build \
              --file docker/Dockerfile.terrarium \
              --target test \
              --platform ${{ matrix.platform }} \
              --secret id=tenv_github_token,env=TENV_GITHUB_TOKEN \
              --build-arg TENV_VERSION="${TENV_VERSION}" \
              --build-arg TERRAFORM_VERSION="${TERRAFORM_VERSION}" \
              --build-arg OPENTOFU_VERSION="${OPENTOFU_VERSION}" \
              --cache-from type=gha,scope=${{ matrix.platform }} \
              --cache-to type=gha,mode=max,scope=${{ matrix.platform }} \
              ./docker \
              && { echo "::endgroup::"; break; } \
              || { echo "::endgroup::"; echo "::warning::Build attempt $attempt failed"; }
            if [ "$attempt" -eq 3 ]; then echo "::error::All 3 build attempts failed"; exit 1; fi
            sleep 30
          done

      # Push: build the clean final stage (no test artifacts)
      - name: Build & push final image
        env:
          TENV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"  # lowercase: OCI repo names must be lowercase (owner may have uppercase)
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          IMAGE_TAG="${TAG#v}"  # git tag keeps the leading v; the published image is v-less
          # Read Dockerfile ARG defaults (see comment on the tenv RUN in
          # docker/Dockerfile.terrarium for why these are forwarded).
          TENV_VERSION=$(scripts/dockerfile-arg.sh TENV_VERSION)
          TERRAFORM_VERSION=$(scripts/dockerfile-arg.sh TERRAFORM_VERSION)
          OPENTOFU_VERSION=$(scripts/dockerfile-arg.sh OPENTOFU_VERSION)

          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            docker buildx build \
              --file docker/Dockerfile.terrarium \
              --target test \
              --platform ${{ matrix.platform }} \
              --secret id=tenv_github_token,env=TENV_GITHUB_TOKEN \
              --push \
              --sbom=false \
              --metadata-file "$RUNNER_TEMP/build-meta.json" \
              --build-arg TENV_VERSION="${TENV_VERSION}" \
              --build-arg TERRAFORM_VERSION="${TERRAFORM_VERSION}" \
              --build-arg OPENTOFU_VERSION="${OPENTOFU_VERSION}" \
              --cache-from type=gha,scope=${{ matrix.platform }} \
              --tag "${IMAGE}:${IMAGE_TAG}${{ matrix.suffix }}" \
              ./docker \
              && { echo "::endgroup::"; break; } \
              || { echo "::endgroup::"; echo "::warning::Push attempt $attempt failed"; }
            if [ "$attempt" -eq 3 ]; then echo "::error::All 3 push attempts failed"; exit 1; fi
            sleep 30
          done

      # INFIAAS-11804: BuildKit's own SBOM (--sbom=true) is off (size-capped,
      # unsigned). Publish a full Syft SBOM attached to the image digest in GHCR
      # and signed keyless. Fails closed: a failure here stops the manifest job,
      # so the :<ver> tag is never published without an SBOM.
      - name: Publish signed SBOM
        id: sbom
        uses: ./.github/actions/publish-sbom
        with:
          metadata-file: ${{ runner.temp }}/build-meta.json
          arch: ${{ matrix.arch }}

  ################################################################################
  # 1b ───────── Attach SBOMs to the GitHub Release (if one exists) ─────────────
  ################################################################################
  # Separate job so the build jobs never hold contents:write (INFIAAS-11804). A
  # workflow_dispatch cut (e.g. v4.9.2-pre) creates only the git tag, not a
  # GitHub Release, so upload only when a Release exists for the tag.
  release-assets:
    name: Attach SBOMs to the GitHub Release
    needs: [tag, release]
    runs-on: ubuntu-24.04
    permissions: { contents: write, actions: read }
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Attach SBOMs (if a GitHub Release exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::No GitHub Release for ${TAG} (dispatch cut) — SBOMs are in GHCR and the sbom-<arch> workflow artifacts"
            exit 0
          fi
          d="$(mktemp -d)"
          for ARCH in amd64 arm64; do
            gh run download "$RUN_ID" --name "sbom-${ARCH}" --dir "$d/${ARCH}"
            gh release upload "$TAG" "$d/${ARCH}/sbom-${ARCH}.spdx.json" "$d/${ARCH}/sbom-${ARCH}.txt" --clobber
            echo "::notice::SBOM (${ARCH}) attached to GitHub Release ${TAG}"
          done

  ################################################################################
  # 2 ────────── Create multi‑arch manifest ────────────────────────────────────
  ################################################################################
  manifest:
    name: Create & push multi-arch manifest
    needs: [release]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/dump-context
        if: github.event.inputs.debug_context == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag and latest eligibility
        id: resolve
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Resolve tag from release event or workflow_dispatch input
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${EVENT_TAG}"
            FLAG_PRERELEASE="${EVENT_PRERELEASE}"
          else
            TAG="${INPUT_TAG}"
            FLAG_PRERELEASE="false"
          fi
          # INFIAAS-11804 (B4): classify by tag name with the shared script (same
          # rule as main.yaml; exit 2 on an unrecognised tag, so `latest` can't
          # move). A release is a pre-release if EITHER the GitHub Release is
          # flagged as one OR its tag name says so (e.g. a UI release of
          # v4.9.0-pre published without the pre-release box ticked).
          NAME_PRERELEASE="$(scripts/is-prerelease.sh "v${TAG#v}")"
          IS_PRERELEASE="false"
          if [ "$FLAG_PRERELEASE" = "true" ] || [ "$NAME_PRERELEASE" = "true" ]; then
            IS_PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          # lowercase image ref for the manifest sources below (a with: block can't use bash ${,,})
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "::notice::Tag=${TAG}, Pre-release=${IS_PRERELEASE}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.image_tag }}
            type=raw,value=latest,enable=${{ steps.resolve.outputs.is_prerelease == 'false' }}

      - name: Create and push manifest
        uses: int128/docker-manifest-create-action@6edb43463bd4878b8cee224ca274378a3635d78f # v2.28.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          sources: |
            ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.image_tag }}-linux-amd64
            ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.image_tag }}-linux-arm64

  ################################################################################
  # 3 ────────── Scan the released image (INFIAAS-11804) ─────────────────────────
  ################################################################################
  # Runs after the manifest, so it scans exactly the published <ver>-linux-<arch>
  # images, for dispatch cuts and UI releases alike. A finding turns this run red
  # (the image is already published): visible, not blocking.
  scan:
    name: Scan released image
    needs: [manifest]
    permissions: { contents: read, packages: read, security-events: write }
    uses: ./.github/workflows/scan.yaml
    with:
      image-tag: ${{ needs.manifest.outputs.image_tag }}
