---
# ── Permissions policy ──────────────────────────────────────────────────────
# Default: contents:read (workflow level).
# packages:write — build/manifest jobs only (GHCR push).
# id-token:write — build job only: keyless cosign signature of the SBOM
#                  (INFIAAS-11804; fork PRs never receive an OIDC token).
# ── Secret isolation policy ─────────────────────────────────────────────────
# No secrets in global env: blocks.
# GITHUB_TOKEN is used by docker/login-action and, in the build steps, as the
# BuildKit secret `tenv_github_token`: only `tenv tofu install` reads it, to
# avoid the anonymous api.github.com rate limit (INFIAAS-11804). The build
# job's token is contents:read + packages:write + id-token:write.
name: Build, test & publish terrarium

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      debug_context:
        description: "Dump GitHub contexts for debugging"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

################################################################################
# 1 ────────── Build & test (matrix: amd64 + arm64) ───────────────────────────
################################################################################
jobs:
  build:
    name: Build & test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: -linux-amd64
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: -linux-arm64
            arch: arm64

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dump-context
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_context == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # INFIAAS-11804: pin BuildKit. The default `buildx-stable-1` floated to
          # v0.32.2 (undocumented 40 MiB attestation cap) and silently broke every
          # publish from 2026-09-17. Dependabot cannot see this pin: bump it
          # deliberately (tag + digest) and re-run a feature-branch dispatch.
          # Enforced by scripts/check-guardrails.sh ("buildkit pinned").
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      # INFIAAS-11916 (S1.6): on TAG pushes, the per-arch `latest-<arch>` and
      # `<major>-<arch>` tags move only for the highest release, so a
      # maintenance release (v4.8.4 after v4.9.6) cannot move them back.
      # `latest=auto` used to add `latest` for ANY release tag. It is now off,
      # and an explicit rule uses the guard. On master PUSHES, `latest-<arch>`
      # still tracks master by design (the {{is_default_branch}} rule; scan.yaml
      # scans it after merge). Exit 2 (unrecognised tag, git failure) fails the job.
      - name: Classify tag (latest guard)
        id: rel
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          move_latest="$(scripts/is-highest-release.sh "$GITHUB_REF_NAME")"
          echo "move_latest=${move_latest}" >> "$GITHUB_OUTPUT"
          echo "::notice::Tag=${GITHUB_REF_NAME}, highest release (moves latest/major)=${move_latest}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false,suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ steps.rel.outputs.move_latest == 'true' }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.rel.outputs.move_latest == 'true' }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gate: build through the test stage — bats must pass
      # Uses a retry loop to handle transient 502 errors from GHA cache / GHCR
      - name: Build & run tests
        env:
          TENV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read Dockerfile ARG defaults and pass as --build-arg so buildkit's
          # cache-from honours version bumps as a cache-key change (without
          # this, stale cached layers for the tenv/terraform/opentofu install
          # step can satisfy cache-from hits and mask version updates).
          TENV_VERSION=$(scripts/dockerfile-arg.sh TENV_VERSION)
          TERRAFORM_VERSION=$(scripts/dockerfile-arg.sh TERRAFORM_VERSION)
          OPENTOFU_VERSION=$(scripts/dockerfile-arg.sh OPENTOFU_VERSION)
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            docker buildx build \
              --file docker/Dockerfile.terrarium \
              --target test \
              --platform ${{ matrix.platform }} \
              --secret id=tenv_github_token,env=TENV_GITHUB_TOKEN \
              --build-arg TENV_VERSION="${TENV_VERSION}" \
              --build-arg TERRAFORM_VERSION="${TERRAFORM_VERSION}" \
              --build-arg OPENTOFU_VERSION="${OPENTOFU_VERSION}" \
              --cache-from type=gha,scope=${{ matrix.platform }} \
              --cache-to type=gha,mode=max,scope=${{ matrix.platform }} \
              ./docker \
              && { echo "::endgroup::"; break; } \
              || { echo "::endgroup::"; echo "::warning::Build attempt $attempt failed"; }
            if [ "$attempt" -eq 3 ]; then echo "::error::All 3 build attempts failed"; exit 1; fi
            sleep 30
          done

      # Push: publish the test stage — the bats suite is intentionally shipped
      # so consumers can re-run it against a running container.
      - name: Build & push final image
        if: github.event_name != 'pull_request'
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_LABELS: ${{ steps.meta.outputs.labels }}
          TENV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build --tag and --label flag arrays from newline-separated metadata outputs.
          # Arrays preserve values that contain spaces (e.g. label descriptions).
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "$META_TAGS"

          label_args=()
          while IFS= read -r label; do
            [ -n "$label" ] && label_args+=(--label "$label")
          done <<< "$META_LABELS"

          # Read Dockerfile ARG defaults — passed as --build-arg so buildkit's
          # cache-from honours version bumps (see comment on the tenv RUN in
          # docker/Dockerfile.terrarium).
          TENV_VERSION=$(scripts/dockerfile-arg.sh TENV_VERSION)
          TERRAFORM_VERSION=$(scripts/dockerfile-arg.sh TERRAFORM_VERSION)
          OPENTOFU_VERSION=$(scripts/dockerfile-arg.sh OPENTOFU_VERSION)
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            docker buildx build \
              --file docker/Dockerfile.terrarium \
              --target test \
              --platform ${{ matrix.platform }} \
              --secret id=tenv_github_token,env=TENV_GITHUB_TOKEN \
              --push \
              --sbom=false \
              --metadata-file "$RUNNER_TEMP/build-meta.json" \
              --build-arg TENV_VERSION="${TENV_VERSION}" \
              --build-arg TERRAFORM_VERSION="${TERRAFORM_VERSION}" \
              --build-arg OPENTOFU_VERSION="${OPENTOFU_VERSION}" \
              --cache-from type=gha,scope=${{ matrix.platform }} \
              "${tag_args[@]}" "${label_args[@]}" \
              ./docker \
              && { echo "::endgroup::"; break; } \
              || { echo "::endgroup::"; echo "::warning::Push attempt $attempt failed"; }
            if [ "$attempt" -eq 3 ]; then echo "::error::All 3 push attempts failed"; exit 1; fi
            sleep 30
          done

      # INFIAAS-11804: BuildKit's own SBOM (--sbom=true) is off — it is
      # size-capped (40 MiB in v0.32.x, 80 MiB from v0.33.0; ours is ~66 MiB)
      # and unsigned. Publish a full Syft SBOM instead, attached to the image
      # digest in GHCR and signed keyless. Fails closed: no SBOM, red build.
      - name: Publish signed SBOM
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/publish-sbom
        with:
          metadata-file: ${{ runner.temp }}/build-meta.json
          arch: ${{ matrix.arch }}

  ################################################################################
  # 2 ────────── Create multi‑arch manifest ────────────────────────────────────
  ################################################################################
  manifest:
    name: Create & push multi-arch manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dump-context
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_context == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          # lowercase image ref for the manifest sources below (a with: block can't use bash ${,,})
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # INFIAAS-11804 (B4) and INFIAAS-11916 (S1.6): `latest` moves only for
      # the highest release. scripts/is-highest-release.sh reuses
      # scripts/is-prerelease.sh, so a pre-release tag never moves it, and
      # neither does an older line published later (v4.8.4 after v4.9.6). An
      # unrecognised tag or a git failure fails this step (exit 2).
      - name: Classify tag (latest guard)
        id: rel
        run: |
          move_latest="$(scripts/is-highest-release.sh "$GITHUB_REF_NAME")"
          echo "move_latest=${move_latest}" >> "$GITHUB_OUTPUT"
          echo "::notice::Tag=${GITHUB_REF_NAME}, highest release (moves latest)=${move_latest}"

      - name: Generate manifest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # INFIAAS-11916 (A-01): without this the action's default latest=auto
          # adds `latest` for ANY release tag via type=semver, bypassing the
          # move_latest guard below. Enforced by check-guardrails.sh.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.rel.outputs.move_latest == 'true' }}

      - name: Create and push manifest
        uses: int128/docker-manifest-create-action@a118e9fe12455375d4810aa318c20e6dba77288e # v2.29.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          sources: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}-linux-amd64
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}-linux-arm64
