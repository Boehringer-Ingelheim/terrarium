# hadolint configuration for docker/Dockerfile.terrarium
#
# Gate policy (plan Phase 2): fail the build on `error`-level findings. The
# `ignored:` list below is the CONTRACT for the refactor — it may only ever
# SHRINK as extraction phases land, never grow. Every entry must be understood
# and justified; no blanket suppressions.
#
# NOTE: hadolint 2.14 cannot parse this Dockerfile because of the two BY-DESIGN
# config heredocs (the google-cloud repo `<<EOF`, which must expand at write
# time, and the tenv profile heredoc). It reports a parse error — not a rule
# finding — that no ignore entry can suppress. INFIAAS-11426 removed every helper
# shell-heredoc; these two remain by design. The hadolint gate is therefore
# INFORMATIONAL in CI (continue-on-error). It can become blocking only if
# hadolint gains heredoc support or the config heredocs are restructured.

failure-threshold: error

# Base images come from these registries only.
trustedRegistries:
  - docker.io          # rockylinux (buildlang stage)
  - registry.access.redhat.com  # ubi9 (builder/test stages)

ignored: []
